<!doctype html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>شغلتي | Shaghlti</title>
<meta name="description" content="منصة موريتانية للإعلان عن الوظائف والبحث عن فرص العمل · Plateforme mauritanienne d'offres d'emploi">
<meta name="theme-color" content="#0d111a">
<link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/auth.css">
<link rel="stylesheet" href="css/responsive.css">
<script>
try{var d=document.documentElement,th=localStorage.getItem('sh-theme')||'dark',l=localStorage.getItem('sh-lang')||'ar';d.dataset.theme=th;d.lang=l;d.dir=l==='ar'?'rtl':'ltr';}catch(e){}
</script>
</head>
<body>
<div id="splash" class="splash"><span class="spinner"></span></div>

<header class="topbar">
  <a class="brand" href="#/" aria-label="Shaghlti">
    <span class="brand-mark"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2M3 13h18"/></svg></span>
    <span class="brand-name" data-i18n="brand"></span>
  </a>
  <div class="top-actions">
    <button id="btn-lang" class="chip-btn" type="button"><span data-icon="globe" data-size="16"></span><span id="lang-label"></span></button>
    <button id="btn-theme" class="icon-btn" type="button" data-i18n-aria="common.theme"></button>
  </div>
</header>

<main class="app">

  <!-- HOME -->
  <section class="view" data-view="home">
    <div class="hero">
      <h1 data-i18n="home.title"></h1>
      <p data-i18n="home.sub"></p>
      <div class="hero-actions">
        <a class="btn btn-primary" href="#/jobs"><span data-icon="search" data-size="18"></span><span data-i18n="home.browse"></span></a>
        <a class="btn btn-ghost" href="#/add" data-lockable><span data-icon="plus" data-size="18"></span><span data-i18n="home.add"></span></a>
      </div>
      <div class="hero-stat" id="home-count"></div>
    </div>
    <div class="section-head"><h2 data-i18n="home.latest"></h2><a class="link" href="#/jobs" data-i18n="home.seeAll"></a></div>
    <div id="home-list" class="job-list"></div>
  </section>

  <!-- JOBS -->
  <section class="view" data-view="jobs">
    <div class="page-head">
      <h1 data-i18n="jobs.title"></h1>
      <a class="btn btn-primary btn-sm" href="#/add" data-lockable><span data-i18n="jobs.add"></span></a>
    </div>
    <div class="search-box"><span data-icon="search" data-size="18"></span><input id="flt-q" type="search" autocomplete="off" data-i18n-ph="jobs.search" data-i18n-aria="jobs.search"></div>
    <div class="select-wrap"><select id="flt-wilaya" data-i18n-aria="add.wilaya"></select><span data-icon="chevron" data-size="16"></span></div>
    <p id="jobs-count" class="count"></p>
    <div id="jobs-list" class="job-list"></div>
  </section>

  <!-- ADD -->
  <section class="view" data-view="add">
    <div class="page-head"><h1 data-i18n="add.title"></h1></div>
    <div id="add-verify"></div>
    <form id="job-form" class="card form" novalidate>
      <div class="field"><label for="f-title" data-i18n="add.titleLabel"></label>
        <input id="f-title" maxlength="80" autocomplete="off" data-i18n-ph="add.titlePh"><p class="field-error" data-err="title"></p></div>
      <div class="field"><label for="f-desc" data-i18n="add.desc"></label>
        <textarea id="f-desc" rows="5" maxlength="2000" data-i18n-ph="add.descPh"></textarea><p class="field-error" data-err="desc"></p></div>
      <div class="field"><span class="label" data-i18n="add.period"></span>
        <div class="seg" role="radiogroup">
          <label><input type="radio" name="period" value="morning"><span data-i18n="job.period.morning"></span></label>
          <label><input type="radio" name="period" value="evening"><span data-i18n="job.period.evening"></span></label>
          <label><input type="radio" name="period" value="both"><span data-i18n="job.period.both"></span></label>
        </div><p class="field-error" data-err="period"></p></div>
      <div class="field"><span class="label" data-i18n="add.days"></span>
        <div class="seg" role="radiogroup">
          <label><input type="radio" name="daysMode" value="daily" checked><span data-i18n="add.daysDaily"></span></label>
          <label><input type="radio" name="daysMode" value="custom"><span data-i18n="add.daysCustom"></span></label>
        </div>
        <div id="days-chips" class="chips" hidden></div><p class="field-error" data-err="days"></p></div>
      <div class="field"><label for="f-salary" data-i18n="add.salary"></label>
        <div class="input-unit"><input id="f-salary" type="number" inputmode="numeric" min="1" max="100000000" step="1"><span class="unit" data-i18n="job.currency"></span></div>
        <p class="field-error" data-err="salary"></p></div>
      <div class="field"><label for="f-wilaya" data-i18n="add.wilaya"></label>
        <div class="select-wrap"><select id="f-wilaya"></select><span data-icon="chevron" data-size="16"></span></div><p class="field-error" data-err="wilaya"></p></div>
      <div class="field"><label for="f-phone" data-i18n="add.phone"></label>
        <div class="input-unit phone" dir="ltr"><span class="prefix">+222</span><input id="f-phone" type="tel" inputmode="numeric" maxlength="14" placeholder="12345678" autocomplete="tel-national"></div>
        <p class="hint" data-i18n="add.phoneHint"></p><p class="field-error" data-err="phone"></p></div>
      <button id="btn-publish" class="btn btn-primary btn-block" type="submit"><span data-i18n="add.publish"></span></button>
    </form>
  </section>

  <!-- ACCOUNT -->
  <section class="view" data-view="account">
    <div class="page-head"><h1 data-i18n="account.title"></h1></div>
    <div id="account-box"></div>
    <div class="section-head"><h2 data-i18n="account.myJobs"></h2></div>
    <div id="my-list" class="job-list"></div>
    <button id="btn-logout" class="btn btn-ghost btn-block logout" type="button"><span data-icon="logout" data-size="18"></span><span data-i18n="auth.logout"></span></button>
  </section>

  <!-- AUTH -->
  <section class="view" data-view="auth">
    <div class="auth-card card">
      <div class="tabs" role="tablist">
        <button type="button" class="tab active" data-tab="login" data-i18n="auth.login"></button>
        <button type="button" class="tab" data-tab="register" data-i18n="auth.register"></button>
      </div>
      <form id="form-login" class="form" novalidate>
        <div class="field"><label for="l-email" data-i18n="auth.email"></label><input id="l-email" type="email" autocomplete="email" dir="ltr"><p class="field-error" data-err="email"></p></div>
        <div class="field"><label for="l-pass" data-i18n="auth.password"></label><input id="l-pass" type="password" autocomplete="current-password" dir="ltr"><p class="field-error" data-err="pass"></p></div>
        <button type="button" id="btn-forgot" class="link-btn" data-i18n="auth.forgot"></button>
        <button class="btn btn-primary btn-block" type="submit"><span data-i18n="auth.login"></span></button>
      </form>
      <form id="form-register" class="form" novalidate hidden>
        <div class="field"><label for="r-name" data-i18n="auth.name"></label><input id="r-name" autocomplete="name" maxlength="60"><p class="field-error" data-err="name"></p></div>
        <div class="field"><label for="r-email" data-i18n="auth.email"></label><input id="r-email" type="email" autocomplete="email" dir="ltr"><p class="field-error" data-err="email"></p></div>
        <div class="field"><label for="r-pass" data-i18n="auth.password"></label><input id="r-pass" type="password" autocomplete="new-password" dir="ltr"><p class="hint" data-i18n="auth.passHint"></p><p class="field-error" data-err="pass"></p></div>
        <div class="field"><label for="r-pass2" data-i18n="auth.confirm"></label><input id="r-pass2" type="password" autocomplete="new-password" dir="ltr"><p class="field-error" data-err="pass2"></p></div>
        <button class="btn btn-primary btn-block" type="submit"><span data-i18n="auth.register"></span></button>
      </form>
      <div class="divider"><span data-i18n="auth.or"></span></div>
      <button id="btn-google" type="button" class="btn btn-google btn-block">
        <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.5 5.8c4.4-4.1 7.1-10.1 7.1-17.5z"/><path fill="#FBBC05" d="M10.5 28.7A14.5 14.5 0 0 1 9.5 24c0-1.6.3-3.2.8-4.7l-7.9-6.1A24 24 0 0 0 0 24c0 3.9.9 7.5 2.6 10.8l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.5-5.8c-2.1 1.4-4.9 2.3-8.4 2.3-6.3 0-11.6-4.1-13.5-9.8l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/></svg>
        <span data-i18n="auth.google"></span>
      </button>
    </div>
  </section>
</main>

<nav class="pillnav" aria-label="Main">
  <a href="#/" data-route="home"><span class="ico" data-icon="home"></span><span class="lbl" data-i18n="nav.home"></span></a>
  <a href="#/jobs" data-route="jobs"><span class="ico" data-icon="briefcase"></span><span class="lbl" data-i18n="nav.jobs"></span></a>
  <a href="#/add" data-route="add" data-lockable><span class="ico" data-icon="plus"></span><span class="lbl" data-i18n="nav.add"></span></a>
  <a href="#/account" data-route="account"><span class="ico" id="nav-account-ico"></span><span class="lbl" id="nav-account-lbl"></span></a>
</nav>

<div id="toasts" class="toasts" aria-live="polite"></div>
<div id="modal-root"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
